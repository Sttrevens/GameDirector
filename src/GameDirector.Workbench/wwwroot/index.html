<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="pageTitle"></title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="/"><b data-i18n="brandMark"></b><span><span data-i18n="product"></span><small data-i18n="workbenchSubtitle"></small></span></a><div class="header-actions"><button id="languageToggle" type="button" data-i18n="languageToggle" data-i18n-aria-label="languageToggleLabel"></button><span id="connection" class="pill" data-i18n="notConnected"></span><button id="settingsButton" data-i18n="settings"></button><button id="connectButton" class="dark" data-i18n="connectProject"></button></div></header>
<main>
<aside class="library"><div class="eyebrow" data-i18n="assetsStep"></div><h2 data-i18n="assets"></h2><label><span data-i18n="currentProject"></span><select id="project"><option value="" data-i18n="selectProject"></option></select></label><div class="split"><span id="assetCount" data-i18n="waitingConnection"></span><button id="refresh" class="text" data-i18n="refreshAssets"></button></div><div id="projectConnection" class="project-connection" hidden><strong id="projectConnectionTitle"></strong><p id="projectConnectionDetail"></p><div class="connection-actions"><button id="retryConnection" type="button" data-i18n="checkConnection"></button><button id="editProjectConnection" type="button" data-i18n="connectionSettings"></button></div></div><input id="search" type="search" data-i18n-placeholder="searchAssetsPlaceholder" data-i18n-aria-label="searchAssets"><div id="assets" class="asset-list"><p class="muted" data-i18n="assetsIntro"></p></div><footer><span data-i18n="assetFlow"></span><br><span><span data-i18n="assetFlowNote"></span><br><span id="storageInfo" data-i18n="storageIntro"></span> <button id="pruneStorage" class="text" type="button" data-i18n="pruneStorage"></button></span></footer></aside>
<section class="cut"><div class="eyebrow" data-i18n="filmStep"></div><div class="title-row"><div><input id="filmTitle" class="title-input" data-i18n-placeholder="filmTitlePlaceholder" data-i18n-aria-label="filmTitle"><p id="filmMeta" data-i18n="filmIntro"></p></div><button id="exportButton" data-i18n="exportScript"></button><button id="importButton" data-i18n="importScript"></button><input type="file" id="importFile" accept="application/json,.json" hidden></div>
<div class="document-bar"><label><span data-i18n="currentFilm"></span><select id="document" data-i18n-aria-label="currentFilm"></select></label><button id="newDocument" data-i18n="newFilm"></button><span id="documentStatus" data-i18n="noDocument"></span></div>
<div id="documentConflict" class="document-conflict" hidden><strong data-i18n="newRevision"></strong><p id="conflictText"></p><button id="reloadDocument" data-i18n="loadRevision"></button><button id="forkDocument" data-i18n="forkFilm"></button></div>
<div id="pendingOperations" class="document-conflict" hidden></div>
<div id="readiness" class="readiness" hidden></div><button id="applyProposal" hidden data-i18n="applyProposal"></button>
<div class="screen"><video id="video" controls playsinline hidden></video><div id="emptyScreen"><div class="viewfinder"><i></i><span data-i18n="viewfinder"></span><i></i></div><h1><span data-i18n="heroLead"></span><br><em data-i18n="heroEnd"></em></h1><p><span data-i18n="heroIntro"></span><br><span data-i18n="heroDetail"></span></p><button id="starter" class="light" data-i18n="starter"></button><div class="screen-caption" data-i18n="screenCaption"></div></div></div>
<div class="transport"><span id="viewerStatus" data-i18n="noCut"></span><a id="download" hidden data-i18n="downloadFilm"></a></div>
<div class="section-title"><h3 data-i18n="shots"></h3><span data-i18n="shotsNote"></span></div><div id="shots" class="shots"><p class="muted" data-i18n="shotsEmpty"></p></div>
<section class="sound"><div class="section-title"><h3 data-i18n="soundCaptions"></h3><button id="audioImportButton" data-i18n="importAudio"></button><input type="file" id="audioFile" accept=".wav,.mp3,.ogg,.flac,.m4a" hidden></div><p class="muted" data-i18n="audioIntro"></p><div class="split"><select id="audioMedia" data-i18n-aria-label="chooseAudio"></select><button id="addAudio" data-i18n="addAudio"></button></div><div class="split"><input id="mediaDescription" data-i18n-placeholder="mediaDescriptionPlaceholder" data-i18n-aria-label="mediaDescription"><button id="saveMediaDescription" data-i18n="saveDescription"></button></div><div id="audioTracks"></div><details><summary data-i18n="captions"></summary><p class="muted" data-i18n="captionFormat"></p><textarea id="captions" data-i18n-placeholder="captionExample" data-i18n-aria-label="captionList"></textarea><button id="applyCaptions" data-i18n="applyCaptions"></button></details></section>
<details class="script"><summary data-i18n="revise"></summary><textarea id="script" spellcheck="false" data-i18n-aria-label="scriptJson"></textarea><div class="split"><span data-i18n="scriptIntro"></span><button id="applyScript" data-i18n="applyScript"></button></div></details>
<div class="production-bar"><button id="validate" data-i18n="checkReadiness"></button><button id="save" data-i18n="saveDraft"></button><div class="spacer"></div><button id="preview" data-i18n="makePreview"></button><button id="render" class="accent" data-i18n="makeCut"></button></div>
<section class="history"><div class="section-title"><h3 data-i18n="productionHistory"></h3><span data-i18n="historyNote"></span></div><div id="jobs"><p class="muted" data-i18n="jobsIntro"></p></div></section>
</section>
<aside class="director"><div class="eyebrow" data-i18n="directStep"></div><h2 data-i18n="director"></h2><div id="providerBadge" class="pill" data-i18n="externalDirector"></div><p class="intro"><span data-i18n="directorIntro"></span><br><span data-i18n="directorDetail"></span></p><label for="brief" data-i18n="brief"></label><textarea id="brief" data-i18n-placeholder="briefPlaceholder"></textarea><button id="direct" class="dark wide" data-i18n="direct"></button><button id="directRender" class="wide" data-i18n="directCut"></button><p class="fine" data-i18n="directPrivacy"></p><div class="director-note"><strong data-i18n="directNoteTitle"></strong><p data-i18n="directNote"></p></div><details class="decisions"><summary data-i18n="decisionAssistant"></summary><p id="decisionStatus" class="muted" data-i18n="loadingDecisions"></p><div class="section-title"><h3 data-i18n="performanceCatalog"></h3><span data-i18n="catalogNote"></span></div><p id="catalogStatus" class="muted" data-i18n="catalogUnread"></p><div class="split"><button id="catalogImport" data-i18n="importCatalog"></button><input type="file" id="catalogFile" accept="application/json,.json" hidden><button id="catalogScaffold" data-i18n="scaffoldCatalog"></button><button id="catalogExport" data-i18n="exportCatalog"></button></div><label for="perfIntent" data-i18n="performanceIntent"></label><input id="perfIntent" data-i18n-placeholder="performanceIntentPlaceholder"><button id="perfMatch" class="wide" data-i18n="matchPerformance"></button><div id="perfResults"></div><div class="section-title"><h3 data-i18n="cameraDecision"></h3><span data-i18n="cameraNote"></span></div><label for="cameraShot" data-i18n="chooseShot"></label><select id="cameraShot"></select><label for="cameraIntent" data-i18n="cameraIntent"></label><input id="cameraIntent" data-i18n-placeholder="cameraIntentPlaceholder"><div class="split"><button id="cameraSuggest" data-i18n="suggestCameras"></button><button id="cameraDecide" class="dark" data-i18n="decideCamera"></button></div><label for="cameraCandidates" data-i18n="cameraCandidates"></label><textarea id="cameraCandidates" spellcheck="false" data-i18n-placeholder="cameraExample"></textarea><div id="cameraResults"></div><div class="section-title"><h3 data-i18n="audioMatch"></h3><span data-i18n="audioMatchNote"></span></div><label for="audioIntent" data-i18n="audioIntent"></label><input id="audioIntent" data-i18n-placeholder="audioIntentPlaceholder"><label for="audioBus" data-i18n="bus"></label><select id="audioBus"><option value="sfx" data-i18n="sfx"></option><option value="music" data-i18n="music"></option><option value="dialogue" data-i18n="dialogueOption"></option></select><button id="audioMatch" class="wide" data-i18n="matchAudio"></button><div id="audioResults"></div><div class="section-title"><h3 data-i18n="filmRanking"></h3><span data-i18n="rankingNote"></span></div><label for="rankBrief" data-i18n="rankBrief"></label><input id="rankBrief" data-i18n-placeholder="rankBriefPlaceholder"><label for="rankCandidates" data-i18n="rankCandidates"></label><textarea id="rankCandidates" spellcheck="false" data-i18n-placeholder="rankExample"></textarea><button id="rankCompare" class="wide" data-i18n="compareFilms"></button><div id="rankResults"></div><div class="section-title"><h3 data-i18n="semanticReview"></h3><span data-i18n="reviewNote"></span></div><label for="reviewSubject" data-i18n="reviewSubject"></label><textarea id="reviewSubject" data-i18n-placeholder="reviewSubjectPlaceholder"></textarea><label for="reviewChecks" data-i18n="reviewChecks"></label><textarea id="reviewChecks" spellcheck="false" data-i18n-placeholder="reviewExample"></textarea><button id="reviewRun" class="wide" data-i18n="runReview"></button><div id="reviewResults"></div><div class="section-title"><h3 data-i18n="decisionRecords"></h3><button id="recordsRefresh" class="text" data-i18n="refresh"></button></div><div id="decisionRecords"><p class="muted" data-i18n="recordsIntro"></p></div><p class="fine" data-i18n="decisionNote"></p></details><details><summary data-i18n="connectAgent"></summary><p><span data-i18n="agentIntro"></span><code data-i18n="agentState"></code><span data-i18n="agentRead"></span><code data-i18n="agentProduce"></code><span data-i18n="agentSubmit"></span></p><p><span data-i18n="workbenchAddress"></span><code id="studioUrl"></code></p></details></aside>
</main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="folderDialog" aria-labelledby="folderTitle"><div class="eyebrow" data-i18n="folderEyebrow"></div><h2 id="folderTitle" data-i18n="folderTitle"></h2><p data-i18n="folderIntro"></p><div id="folderShortcuts" class="folder-shortcuts"></div><nav id="folderBreadcrumbs" class="folder-breadcrumbs" data-i18n-aria-label="folderPath"></nav><div class="folder-toolbar"><button id="folderUp" type="button" data-i18n="folderUp"></button><input id="folderSearch" type="search" data-i18n-placeholder="folderSearchPlaceholder" data-i18n-aria-label="folderSearch"></div><div id="folderError" class="folder-error" role="status" hidden></div><div id="folderList" class="folder-list" data-i18n-aria-label="subfolders"></div><div class="folder-selected"><span data-i18n="folderSelected"></span><span id="folderSelection"></span></div><div class="dialog-actions"><button type="button" data-close="folderDialog" data-i18n="cancel"></button><button id="chooseProjectFolder" type="button" class="accent" disabled data-i18n="chooseFolder"></button></div></dialog>
<dialog id="connectDialog"><form id="connectForm"><div class="eyebrow" data-i18n="connectEyebrow"></div><h2 id="connectTitle" data-i18n="connectTitle"></h2><p data-i18n="connectIntro"></p><label><span data-i18n="projectName"></span><input id="projectName" required data-i18n-placeholder="projectNamePlaceholder"></label><label><span data-i18n="projectId"></span><input id="projectId" required pattern="[a-zA-Z0-9][a-zA-Z0-9_\-]{0,79}" data-i18n-placeholder="projectIdPlaceholder"></label><label><span data-i18n="engine"></span><select id="engine"><option value="Unity" data-i18n="engineUnity"></option><option value="Three.js" data-i18n="engineThree"></option><option value="Custom" data-i18n="engineCustom"></option></select></label><label for="sourceRoot" data-i18n="sourceRoot"></label><div class="folder-field"><input id="sourceRoot" data-i18n-placeholder="sourceRootPlaceholder"><button id="browseProjectFolder" type="button" data-i18n="browseFolder"></button></div><label><span data-i18n="endpoint"></span><input id="endpoint" type="url" required value="http://127.0.0.1:39777"></label><p id="connectError" class="folder-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" data-close="connectDialog" data-i18n="cancel"></button><button id="submitProject" class="accent" data-i18n="addProject"></button></div></form></dialog>
<dialog id="mediaDialog"><div class="eyebrow" data-i18n="mediaEyebrow"></div><h2 data-i18n="mediaTitle"></h2><p data-i18n="mediaIntro"></p><div id="mediaOptions"></div><p id="mediaInstallStatus" role="status"></p><pre id="mediaInstallTail" hidden></pre><div class="dialog-actions"><button id="mediaInstallCancel" type="button" hidden data-i18n="cancelInstall"></button><button type="button" data-close="mediaDialog" data-i18n="close"></button></div></dialog>
<dialog id="settingsDialog"><form id="settingsForm"><div class="eyebrow" data-i18n="providerEyebrow"></div><h2 data-i18n="providerTitle"></h2><p data-i18n="providerIntro"></p><label><span data-i18n="apiEndpoint"></span><input id="apiEndpoint" type="url" data-i18n-placeholder="apiEndpointPlaceholder"></label><label><span data-i18n="model"></span><input id="model" data-i18n-placeholder="modelPlaceholder"></label><label><span data-i18n="apiKey"></span><input id="apiKey" type="password" autocomplete="off" data-i18n-placeholder="optionalKey"></label><div class="eyebrow" data-i18n="decisionEyebrow"></div><h2 data-i18n="decisionTitle"></h2><p data-i18n="decisionIntro"></p><label><span data-i18n="decisionEndpoint"></span><input id="jevEndpoint" type="url" data-i18n-placeholder="decisionEndpointPlaceholder"></label><label><span data-i18n="decisionModel"></span><input id="jevModel" data-i18n-placeholder="decisionModelPlaceholder"></label><label><span data-i18n="decisionKey"></span><input id="jevApiKey" type="password" autocomplete="off"></label><div class="policy-grid"><span data-i18n="task"></span><span data-i18n="enabled"></span><span data-i18n="confidenceThreshold"></span><label data-i18n="performanceMatch"></label><input type="checkbox" id="jevPerfOn"><input type="number" id="jevPerfMin" min="0" max="1" step="0.05"><label data-i18n="cameraChoice"></label><input type="checkbox" id="jevCamOn"><input type="number" id="jevCamMin" min="0" max="1" step="0.05"><label data-i18n="audioMatch"></label><input type="checkbox" id="jevAudioOn"><input type="number" id="jevAudioMin" min="0" max="1" step="0.05"><label data-i18n="filmRank"></label><input type="checkbox" id="jevRankOn"><input type="number" id="jevRankMin" min="0" max="1" step="0.05"><label data-i18n="semanticReview"></label><input type="checkbox" id="jevReviewOn"><span class="muted" data-i18n="noThreshold"></span></div><p class="fine" data-i18n="thresholdNote"></p><div class="dialog-actions"><button type="button" id="disconnectDecisions" data-i18n="disconnectDecisions"></button><button type="button" id="disconnectProvider" data-i18n="disconnect"></button><button type="button" data-close="settingsDialog" data-i18n="cancel"></button><button class="accent" data-i18n="saveConnection"></button></div></form></dialog>
<script src="/app.js" type="module"></script></body></html>
