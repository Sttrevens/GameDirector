name: Verify director product
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Windows Python defaults to cp1252; every tool reads and writes UTF-8.
  PYTHONUTF8: '1'
jobs:
  layout:
    runs-on: ubuntu-latest
    outputs:
      rids: ${{ steps.manifest.outputs.rids }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        shell: python
        run: |
          import json, os
          with open('tools/distribution.json') as source:
              rids = json.load(source)['supportedPlatforms']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('rids=' + json.dumps(rids) + '\n')
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode
      - id: build
        run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-restore --configuration Release --logger trx
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_unity_installer.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_archive_layout.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_runtime_packaging.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_nuget_packaging.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_product_versions.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_godot_mcp_support.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_godot_assets.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_godot_staging.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_godot_dock_support.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_doc_links.py --self-test
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/test_doc_links.py
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/test_document_state.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: '**/TestResults/*.trx'
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet restore --locked-mode && dotnet build --no-restore
      # Exercise the recorder-to-validator wiring, not just the pure validators:
      # these MediaTheory cases otherwise legitimately skip on encoder-free hosts.
      - run: dotnet test --no-restore --filter "FullyQualifiedName~TakeReceiptProtocolTests|FullyQualifiedName~TakeArtifactTests" --logger trx
      - run: python3 tools/test_media_pipeline.py
      - run: node tools/test_picture_diff.mjs
      - run: dotnet run --project tools/MediaBundleValidation -- captures/media-bundle "$(command -v ffmpeg)" "$(command -v ffprobe)"
      - run: python3 tools/test_take_recovery.py
      - run: python3 tools/test_workbench.py
      - run: python3 tools/test_film_documents.py
      - run: python3 tools/test_decisions_http.py
      - run: python3 tools/test_mcp_errors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-and-recovery
          path: captures/
  contracts:
    # Engine-facing contract surfaces that run without a game checkout: the
    # gd contract --json / compile --take black-box export, the Three bridge's
    # admission + error protocol against a synthetic game, and the committed
    # Core DLL's deterministic rebuild check (ubuntu byte-compares the build).
    # setup-dotnet installs sdk.version exactly via global-json-file; the DLL
    # script pins rollForward:disable in scratch and asserts that exact SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: python3 tools/test_cli_contract.py
      - run: python3 tools/test_godot_contract_reads.py
      - run: python3 tools/test_temp_dirs.py
      - run: python3 tools/test_three_dev_tools.py
      - run: npm ci --ignore-scripts --prefix packages/gamedirector-three
      - run: node tools/test_three_bundle.mjs
      - run: node tools/test_three_envelope.mjs
      - run: node tools/test_three_presentation.mjs
      - run: node tools/test_fps_agreement_unit.mjs
      - run: node tools/test_bridge_admission.mjs
      - run: node tools/test_three_hermetic.mjs
      - run: node tools/test_three_conformance.mjs
      - run: node tools/test_three_roles.mjs
      - run: node tools/test_three_measure.mjs
      - run: node tools/test_three_contract.mjs
      - run: python3 tools/test_engine_contract_reads.py --self-test
      - run: python3 tools/test_engine_contract_reads.py
      - run: bash tools/build_core_dll.sh --check
      - run: python3 tools/test_core_dll.py
  package:
    runs-on: ubuntu-latest
    needs: [core, media, layout]
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.layout.outputs.rids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      # CI may populate an empty cache; the publisher itself stays cache-only.
      - shell: python
        run: |
          import json, subprocess, tempfile
          with open('tools/distribution.json') as source:
              apps = json.load(source)['apps']
          with tempfile.TemporaryDirectory() as locks:
              for app in apps.values():
                  subprocess.run(['dotnet', 'restore', app['project'], '-r', '${{ matrix.runtime }}',
                      '-p:GameDirectorPublishLockRoot=' + locks], check=True)
      - run: python3 tools/test_shared_runtime.py --runtime ${{ matrix.runtime }}
      - run: python3 tools/package_release.py --runtime ${{ matrix.runtime }} --out dist/candidate-${{ matrix.runtime }}
      - shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          import gamedirector_dist as dist
          config = dist.load_config(dist.REPO)
          rid = '${{ matrix.runtime }}'
          folder = pathlib.Path('dist/candidate-' + rid)
          upm = pathlib.Path('dist/upm-' + rid)
          subprocess.run([sys.executable, 'tools/package_unity_candidate.py', '--runtime', rid,
              '--out', str(upm), '--runtime-source', str(folder / config['runtimeFolder'])], check=True)
          if rid == 'linux-x64':
              tgz = upm / dist.archive_name(config, dist.read_version(dist.REPO), rid, unity=True)
              subprocess.run([sys.executable, 'tools/test_package_equivalence.py', '--distribution', str(folder),
                  '--package', str(tgz), '--out', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamedirector-package-equivalence')], check=True)
      - if: matrix.runtime == 'linux-x64'
        run: python3 tools/test_distribution_smoke.py --distribution dist/candidate-${{ matrix.runtime }} --out "${{ runner.temp }}/gamedirector-native-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: director-candidate-${{ matrix.runtime }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/upm-*/*.tgz
  native-package:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: host
        shell: python
        run: |
          import os, platform
          system = {'Windows': 'win', 'Darwin': 'osx'}[platform.system()]
          architecture = {'AMD64': 'x64', 'x86_64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'rid={system}-{architecture}\n')
      - shell: python
        run: |
          import json, subprocess, tempfile
          with open('tools/distribution.json') as source:
              apps = json.load(source)['apps']
          with tempfile.TemporaryDirectory() as locks:
              for app in apps.values():
                  subprocess.run(['dotnet', 'restore', app['project'], '-r', '${{ steps.host.outputs.rid }}',
                      '-p:GameDirectorPublishLockRoot=' + locks], check=True)
      - run: python tools/test_shared_runtime.py --runtime ${{ steps.host.outputs.rid }}
      - run: python tools/package_release.py --runtime ${{ steps.host.outputs.rid }} --out dist/native
      - shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          import gamedirector_dist as dist
          config = dist.load_config(dist.REPO)
          rid = '${{ steps.host.outputs.rid }}'
          upm = pathlib.Path('dist/upm')
          subprocess.run([sys.executable, 'tools/package_unity_candidate.py', '--runtime', rid,
              '--out', str(upm), '--runtime-source', str(pathlib.Path('dist/native') / config['runtimeFolder'])], check=True)
          tgz = upm / dist.archive_name(config, dist.read_version(dist.REPO), rid, unity=True)
          subprocess.run([sys.executable, 'tools/test_package_equivalence.py', '--distribution', 'dist/native',
              '--package', str(tgz), '--out', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'gamedirector-package-equivalence')], check=True)
      - run: python tools/test_distribution_smoke.py --distribution dist/native --out "${{ runner.temp }}/gamedirector-native-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/gamedirector-native-smoke
